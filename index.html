<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Me | 赞赏支持</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.95);
            --primary: #6366f1;
            --wechat: #07c160;
            --alipay: #1677ff;
            --trc: #ef4444;
            --text-main: #1e293b;
            --text-sub: #64748b;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; transition: all 0.2s ease; }
        
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: var(--bg);
            background-image: radial-gradient(at 0% 0%, #e0e7ff 0%, transparent 40%), radial-gradient(at 100% 100%, #fae8ff 0%, transparent 40%);
            font-family: -apple-system, system-ui, sans-serif; padding: 20px;
        }

        .card {
            width: 100%; max-width: 400px; background: var(--card-bg); backdrop-filter: blur(20px);
            border-radius: 32px; padding: 40px 24px 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.08);
            text-align: center; position: relative; border: 1px solid rgba(255,255,255,0.7);
        }

        .lang-switch {
            position: absolute; top: 20px; right: 20px; background: #fff; border: 1px solid #e2e8f0;
            padding: 4px 12px; border-radius: 50px; font-size: 11px; font-weight: 700; cursor: pointer; color: var(--primary);
        }

        h1 { font-size: 20px; color: var(--text-main); margin: 0 0 8px; font-weight: 800; }
        .desc { font-size: 13px; color: var(--text-sub); margin: 0 0 24px; }

        /* 支付按钮 */
        .btn {
            display: flex; align-items: center; justify-content: space-between; padding: 14px 18px;
            background: #fff; border: 1px solid #f1f5f9; border-radius: 16px; cursor: pointer; margin-bottom: 10px;
        }
        .btn:hover { transform: translateY(-2px); border-color: var(--primary); box-shadow: 0 8px 20px rgba(99,102,241,0.06); }
        .btn-left { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; color: var(--text-main); }
        
        /* TRC20 */
        .crypto-card {
            margin: 16px 0; padding: 12px; background: #fff1f2; border-radius: 16px; border: 1px dashed #fecdd3;
            cursor: pointer; text-align: left;
        }
        .crypto-label { font-size: 10px; font-weight: 800; color: var(--trc); text-transform: uppercase; letter-spacing: 1px; }
        .address { font-family: monospace; font-size: 11px; color: #991b1b; word-break: break-all; display: block; margin-top: 4px;}

        /* --- 新增：鸣谢名单区 --- */
        .thanks-box {
            background: rgba(0,0,0,0.02); border-radius: 16px; padding: 15px; margin: 20px 0;
            overflow: hidden; height: 80px; position: relative;
        }
        .thanks-title { font-size: 11px; font-weight: 700; color: var(--text-sub); margin-bottom: 8px; text-transform: uppercase; }
        .scroll-list { animation: scrollUp 10s linear infinite; position: absolute; width: calc(100% - 30px); }
        .scroll-item { font-size: 12px; color: var(--text-main); padding: 4px 0; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(0,0,0,0.03); }
        .scroll-item span:last-child { font-weight: bold; color: var(--primary); }

        @keyframes scrollUp {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        .divider { height: 1px; background: linear-gradient(to right, transparent, #e2e8f0, transparent); margin: 20px 0; }
        .social-links { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
        .social-item { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: #fff; border-radius: 10px; border: 1px solid #f1f5f9; color: var(--text-sub); text-decoration: none; }
        .social-item:hover { color: var(--primary); border-color: var(--primary); transform: scale(1.1); }
        .copyright { font-size: 11px; color: #94a3b8; }

        /* 弹窗 */
        .overlay { position: absolute; inset: 0; background: rgba(255,255,255,0.98); border-radius: 32px; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        .qr-frame { background: #fff; padding: 12px; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.08); border: 1px solid #f1f5f9; }
        .qr-frame img { width: 180px; height: 180px; border-radius: 12px; }
        .close-btn { color: var(--text-sub); font-size: 12px; font-weight: 700; cursor: pointer; border: 1px solid #e2e8f0; padding: 8px 24px; border-radius: 50px; margin-top: 20px; }
        .toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 8px 20px; border-radius: 12px; font-size: 12px; display: none; z-index: 100; }
    </style>
</head>
<body>

<div class="card">
    <div class="lang-switch" onclick="toggleLang()" id="langBtn">EN</div>

    <h1 id="t-title">请作者喝杯咖啡</h1>
    <p class="desc" id="t-desc">您的支持是我创作的动力</p>

    <!-- 支付按钮 -->
    <div onclick="openQR('wechat')" class="btn">
        <div class="btn-left">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--wechat)"><path d="M8.5 14a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1zm6.5 0a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1zM11 4C6.1 4 2 7.6 2 12c0 2.4 1.2 4.5 3.1 6-.2.6-.8 2.1-.8 2.1s1.5-.3 2.5-.9c.8.2 1.7.3 2.5.3 1.1 0 2.2-.2 3.2-.6-1.1-2.4-.4-5.1 1.7-6.7 1.4-1.1 3.2-1.5 4.9-1.2.1-.3.1-.7.1-1 0-4.4-4.1-8-9-8zm7.5 7c-2.5 0-4.5 1.8-4.5 4s2 4 4.5 4c.5 0 1-.1 1.4-.2.6.4 1.3.6 1.3.6s-.3-1-.4-1.4c.8-.8 1.2-1.9 1.2-3 0-2.2-2-4-4.5-4z"/></svg>
            <span id="t-wechat">微信支付</span>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="3"><path d="M9 5l7 7-7 7"/></svg>
    </div>

    <div onclick="openQR('alipay')" class="btn">
        <div class="btn-left">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--alipay)"><path d="M11.7 15.1l-2.4-4h8.3l-1.1 3.5h-2.6c-.9 1.5-2.2 2.6-3.8 3.2l2.6 1.3-.9 1.2-4.1-2.1c-.6.2-1.3.3-2 .4l-.3-1.4c1.1-.1 2.1-.4 2.9-.8l-2.1-3.3 1.1-.9 1.8 2.9c1.1-.5 2-1.4 2.6-2.6h-5.2l2.6 4.1-.7.5zm7.3-8.8v1.3H5v-1.3h5.2V5h1.5v1.3h5.3z"/></svg>
            <span id="t-alipay">支付宝</span>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="3"><path d="M9 5l7 7-7 7"/></svg>
    </div>

    <!-- TRC20 -->
    <div class="crypto-card" onclick="copyTRC('TVpQGTxEJPrfEEWQW5xoSa1h2LBf6a8qyq')">
        <span class="crypto-label">TRC20 (USDT / TRX)</span>
        <span class="address">TVpQGTxEJPrfEEWQW5xoSa1h2LBf6a8qyq</span>
    </div>
   <!-- 鸣谢区 -->
    <div class="thanks-title" id="t-thanks">最近鸣谢</div>
    <div class="thanks-box">
        <div class="scroll-list" id="supporter-list">
            <!-- 名单将由 JS 自动填充 -->
        </div>
    </div>

    <div class="divider"></div>

    <div class="social-links">
        <a href="#" class="social-item"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.17 6.839 9.49.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.577.688.48C19.138 20.167 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg></a>
        <a href="#" class="social-item"><svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></a>
        <a href="#" class="social-item"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg></a>
    </div>

    <div class="copyright">
        &copy; <span id="year"></span> <span>萧亚轩</span>. <span id="t-rights">保留所有权利</span>
    </div>

    <!-- 浮层 -->
    <div class="overlay" id="qrOverlay">
        <div id="qrTitle" style="font-weight: 800; margin-bottom: 20px; color: var(--text-main);"></div>
        <div class="qr-frame"><img id="qrImg" src="" alt="QR"></div>
        <div class="close-btn" onclick="closeQR()" id="t-close">关闭</div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    // 1. 在这里编辑捐赠者名单
    const supporters = [
        { name: "Zhang *", amount: "￥50", msg: "感谢分享！", msg_en: "Thanks for sharing!" },
        { name: "Alex", amount: "$10", msg: "Keep going!", msg_en: "Keep going!" },
        { name: "王*明", amount: "￥6.6", msg: "请喝咖啡", msg_en: "Buy you a coffee" },
        { name: "CryptoKing", amount: "20 TRX", msg: "Good job", msg_en: "Good job" }
    ];

    const i18n = {
        zh: { title: "请作者喝杯咖啡", desc: "您的支持是我创作的动力", wechat: "微信支付", alipay: "支付宝", rights: "保留所有权利", close: "关闭", toast: "✅ 已成功复制", btn: "EN", thanks: "最近鸣谢", qrWechat: "微信扫码支付", qrAlipay: "支付宝扫码支付" },
        en: { title: "Support Me", desc: "Your support keeps me going", wechat: "WeChat Pay", alipay: "Alipay", rights: "All Rights Reserved", close: "Close", toast: "✅ Copied Successfully", btn: "中文", thanks: "Recent Supporters", qrWechat: "Scan with WeChat", qrAlipay: "Scan with Alipay" }
    };

    let currentLang = localStorage.getItem('lang') || 'zh';

    function renderSupporters() {
        const list = document.getElementById('supporter-list');
        const data = [...supporters, ...supporters]; // 复制一份实现无缝滚动
        list.innerHTML = data.map(s => `
            <div class="scroll-item">
                <span>${s.name} (${currentLang === 'zh' ? s.msg : s.msg_en})</span>
                <span>${s.amount}</span>
            </div>
        `).join('');
    }

    function updateUI() {
        const lang = i18n[currentLang];
        document.getElementById('t-title').innerText = lang.title;
        document.getElementById('t-desc').innerText = lang.desc;
        document.getElementById('t-wechat').innerText = lang.wechat;
        document.getElementById('t-alipay').innerText = lang.alipay;
        document.getElementById('t-rights').innerText = lang.rights;
        document.getElementById('t-close').innerText = lang.close;
        document.getElementById('langBtn').innerText = lang.btn;
        document.getElementById('t-thanks').innerText = lang.thanks;
        renderSupporters();
    }

    function toggleLang() {
        currentLang = currentLang === 'zh' ? 'en' : 'zh';
        localStorage.setItem('lang', currentLang);
        updateUI();
    }

    function openQR(type) {
        const overlay = document.getElementById('qrOverlay');
        const img = document.getElementById('qrImg');
        const titleEl = document.getElementById('qrTitle');
        img.src = type + '.png'; 
        titleEl.innerText = type === 'wechat' ? i18n[currentLang].qrWechat : i18n[currentLang].qrAlipay;
        overlay.style.display = 'flex';
    }

    function closeQR() { document.getElementById('qrOverlay').style.display = 'none'; }

    function copyTRC(text) {
        navigator.clipboard.writeText(text).then(() => {
            const toast = document.getElementById('toast');
            toast.innerText = i18n[currentLang].toast;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        });
    }

    document.getElementById('year').textContent = new Date().getFullYear();
    updateUI();
</script>
</body>
</html>
